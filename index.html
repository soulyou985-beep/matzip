<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b8232a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>맛집 수첩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 친근하고 빠른 생활 도구, 노포 간판처럼 힘 있게
   IDEA: 식당 벽에 붙은 붉은 간판 + 손때 묻은 맛집 수첩
   PICTURE: 식당 카드 목록 자체가 주인공, 상단은 간판 띠
   COLOUR and TYPE: 고추빛 빨강 간판, 흰 바탕, 먹색 글자, 겨자색 포인트 / Black Han Sans + Noto Sans KR
   LAYOUT: 고정 간판 띠와 필터, 아래로 지역별 묶음 카드 */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141112);--card:light-dark(#fff,#1f1a1b);--line:light-dark(#ece6e2,#352d2e);--ink:light-dark(#1d1718,#f3ecea);--mute:light-dark(#6f6563,#b3a8a6);--red:#b8232a;--red2:light-dark(#fbeceb,#3a1c1e);--mus:#f2b632;--ok:light-dark(#1f7a4d,#5fd39a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
header{background:var(--red);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) max(4vw,16px) 12px}
h1{font:400 clamp(30px,8vw,44px)/1.05 "Black Han Sans",sans-serif;margin:0;letter-spacing:.5px}
.sub{margin:4px 0 12px;font-size:14px;opacity:.9}
.shows{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.shows button{flex:none;min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid rgba(255,255,255,.55);background:transparent;color:#fff;font-weight:700;font-size:15px}
.shows button[aria-pressed=true]{background:#fff;color:var(--red);border-color:#fff}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px max(4vw,16px)}
.regions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-bottom:8px}
.regions button{min-height:44px;border:0;border-radius:10px;background:var(--red2);font-weight:700;font-size:14px;line-height:1.15;padding:4px 2px}
.regions button small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.regions button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.regions button[aria-pressed=true] small{color:inherit;opacity:.75}
.row{display:flex;gap:6px}
#q{flex:1;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card);font-size:16px}
#q:focus,select:focus,button:focus-visible,a:focus-visible{outline:2.5px solid var(--mus);outline-offset:1px}
select{min-height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:0 8px;font-size:15px;max-width:42%}
.chips{display:flex;gap:6px;margin-top:8px;align-items:center;font-size:14px;color:var(--mute)}
.chips button{min-height:34px;border:1.5px solid var(--line);background:var(--card);border-radius:17px;padding:0 12px;font-size:14px}
.chips button[aria-pressed=true]{border-color:var(--ok);color:var(--ok);font-weight:700}
.chips span{margin-left:auto}
main{padding:6px max(4vw,16px) calc(env(safe-area-inset-bottom) + 40px);max-width:860px;margin:0 auto}
h2{font:400 22px/1.2 "Black Han Sans",sans-serif;margin:22px 0 8px;display:flex;align-items:baseline;gap:8px}
h2 small{font:500 13px "Noto Sans KR",sans-serif;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px 12px;margin-bottom:10px}
.card.done{opacity:.62}
.top{display:flex;gap:8px;align-items:flex-start}
.name{font-size:18px;font-weight:700;line-height:1.3;flex:1}
.tag{flex:none;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;color:#fff;margin-top:3px}
.t0{background:var(--red)}.t1{background:#2d5fa8}.t2{background:#7a4bb0}
.area{font-size:13px;color:var(--mute);margin-top:1px}
.menu{margin:7px 0 2px;font-size:15px}
.menu b{color:var(--red);font-weight:700;margin-right:4px}
.addr{font-size:14px;color:var(--mute)}
.addr em{font-style:normal;font-size:12px;background:var(--red2);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}
.memo{font-size:14px;margin-top:4px}
.acts{display:flex;gap:6px;margin-top:10px}
.acts a,.acts button{min-height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-decoration:none;padding:0 10px;border:1.5px solid var(--line);background:var(--card)}
.acts a.map{flex:1;background:#03c75a;border-color:#03c75a;color:#fff}
.acts a.gmap{flex:1;background:#2d5fa8;border-color:#2d5fa8;color:#fff}
.acts button.v[aria-pressed=true]{border-color:var(--ok);color:var(--ok)}
.empty{text-align:center;color:var(--mute);padding:48px 0}
.note{font-size:13px;color:var(--mute);text-align:center;margin-top:28px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
  <h1>맛집 수첩</h1>
  <p class="sub">먹을텐데 · 최자로드 · 또간집 추천 식당 <span id="total"></span></p>
  <div class="shows" id="shows"></div>
</header>
<div class="bar">
  <div class="regions" id="regions"></div>
  <div class="row">
    <input id="q" type="search" placeholder="식당, 메뉴, 동네 검색" autocomplete="off">
    <select id="area" aria-label="세부 지역"></select>
  </div>
  <div class="chips">
    <button id="fNot" aria-pressed="false">안 가본 곳만</button>
    <button id="fDone" aria-pressed="false">가 본 곳만</button>
    <span id="count"></span>
  </div>
</div>
<main id="list"></main>
<div id="toast" role="status"></div>

  const map=d.region==='해외'
    ?(d.g?`<a class="gmap" href="${esc(d.g)}" target="_blank" rel="noopener">구글지도</a>`:`<a class="gmap" href="https://www.google.com/maps/search/${encodeURIComponent(d.name+' '+d.area)}" target="_blank" rel="noopener">구글지도</a>`)
    :`<a class="map" href="https://map.naver.com/p/search/${encodeURIComponent(d.nq)}" target="_blank" rel="noopener">네이버지도</a>`;
  return `<article class="card${v?' done':''}"><div class="top"><div class="name">${esc(d.name)}<div class="area">${esc(d.area)}</div></div><span class="tag t${d.t}">${esc(d.show)}</span></div>
  ${d.menu?`<p class="menu"><b>메뉴</b>${esc(d.menu)}</p>`:''}
  <div class="addr">${esc(d.g?d.area:d.addr)}${d.vague?'<em>동 단위</em>':''}</div>
  ${d.memo?`<div class="memo">${esc(d.memo)}</div>`:''}
  <div class="acts">${map}<button class="c" data-a="${esc(d.g?d.name+' '+d.area:d.addr)}">주소 복사</button><button class="v" data-id="${esc(d.id)}" aria-pressed="${v}">${v?'✓ 가 봤어요':'가 봤어요'}</button></div></article>`;
}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}
$('shows').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.show=b.dataset.s;saveS();draw()};
$('regions').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.reg=b.dataset.r;st.area='';saveS();draw();window.scrollTo(0,0)};
$('area').onchange=e=>{st.area=e.target.value;saveS();draw()};
$('q').oninput=e=>{st.q=e.target.value;draw()};
$('fNot').onclick=()=>{st.f=st.f==='not'?'':'not';saveS();draw()};
$('fDone').onclick=()=>{st.f=st.f==='done'?'':'done';saveS();draw()};
$('list').onclick=async e=>{
  const v=e.target.closest('button.v');
  if(v){const id=v.dataset.id;if(visited[id])delete visited[id];else visited[id]=1;saveV();draw();return}
  const c=e.target.closest('button.c');
  if(c){try{await navigator.clipboard.writeText(c.dataset.a);toast('주소를 복사했어요')}catch(err){toast(c.dataset.a)}}
};
draw();
}
</script>
</body>
</html>
